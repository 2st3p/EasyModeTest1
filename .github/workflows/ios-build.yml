name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer" || true
      - name: Build
        run: xcodebuild -project EasyModeTest1.xcodeproj -scheme EasyModeTest1 -destination 'platform=iOS Simulator,name=iPhone 15' build | xcpretty

