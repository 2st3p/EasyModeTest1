name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Prepare test runner
        run: chmod +x scripts/test.sh
      - name: Unit tests
        run: ./scripts/test.sh unit
      - name: UI regressions
        run: ./scripts/test.sh ui
